<!DOCTYPE html>
<html>
<head>
<style>
    body {
        background: #fc3a84;
        color: white;
        text-align: center;
        font-family: sans-serif;
        padding-top: 60px;
        margin: 0;
    }
    h2 { font-size: 1.8rem; margin-bottom: 10px; }
    p.sub { opacity: 0.9; margin-bottom: 25px; }
    .board {
        width: 340px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 75px);
        grid-template-rows: repeat(4, 75px);
        gap: 8px;
    }
    .card {
        width: 75px;
        height: 75px;
        background: #8e2140;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        cursor: pointer;
        user-select: none;
        transition: 0.15s;
    }
    .card.flipped, .card.matched {
        background: #fdd6df;
        color: #8e2140;
    }
    .card.matched { opacity: 0.6; cursor: default; }
    a.back {
        display: inline-block;
        margin-top: 30px;
        color: white;
        text-decoration: underline;
        font-size: 1.1rem;
    }
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(142,33,64,0.95);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 20px;
    }
    .overlay.show { display: flex; }
    .overlay p { font-size: 1.5rem; max-width: 600px; }
    .overlay h1 { font-size: 3rem; }
</style>
</head>
<body>
    <h2>Match the pairs 💕</h2>
    <p class="sub">Flip two cards at a time to find matches.</p>
    <div class="board" id="board"></div>
    <a class="back" href="/">Back Home</a>

    <div class="overlay" id="overlay">
        <h1>💌</h1>
        <p>{{ text }}</p>
        <a class="back" href="/" style="margin-top:10px;">Back Home</a>
    </div>

<script>
const emojis = ['💖','🌹','😻','💌','🎀','🌙','🍫','⭐'];
let cards = [...emojis, ...emojis];
for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
}

const board = document.getElementById('board');
let flipped = [];
let lock = false;
let matchedCount = 0;

cards.forEach((emoji, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.index = idx;
    card.addEventListener('click', () => flip(card));
    board.appendChild(card);
});

function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.textContent = card.dataset.emoji;
    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
        lock = true;
        const [a, b] = flipped;
        if (a.dataset.emoji === b.dataset.emoji) {
            a.classList.add('matched');
            b.classList.add('matched');
            matchedCount += 2;
            flipped = [];
            lock = false;
            if (matchedCount === cards.length) {
                setTimeout(() => document.getElementById('overlay').classList.add('show'), 400);
            }
        } else {
            setTimeout(() => {
                a.classList.remove('flipped');
                b.classList.remove('flipped');
                a.textContent = '';
                b.textContent = '';
                flipped = [];
                lock = false;
            }, 700);
        }
    }
}
</script>
</body>
</html>
