<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eb478e;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #f6f4f5;
            margin-bottom: 50px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        a {
            text-decoration: none;
            padding: 40px;
            background: #8e2140;
            border-radius: 20px;
            color: #f8fafc;
            font-weight: bold;
            transition: 0.3s;
            text-align: center;
            border: 1px solid #f23e7a;
        }

        a:hover {
            background: #fd93a3;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>open one :b</h1>
    <div class="grid">
        <a href="/letter/1">box 1</a>
        <a href="/letter/2">box 2</a>
        <a href="/letter/3">box 3</a>
        <a href="/letter/4">box 4</a>
        <a href="/letter/5">box 5</a>
        <a href="/letter/6">box 6</a>
    </div>
</body>

</html>
